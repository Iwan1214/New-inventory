<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory Global</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #1e3a8a;
  --navy2: #1e40af;
  --blue: #2563eb;
  --blue-light: #dbeafe;
  --bg: #f1f5f9;
  --white: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text2: #64748b;
  --label: #1e3a8a;
  --input-bg: #f8fafc;
  --shadow: 0 2px 12px rgba(30,58,138,0.08);
  --shadow-hover: 0 8px 28px rgba(30,58,138,0.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── PAGE SYSTEM ── */
.page{display:none;}
.page.active{display:flex;}

/* ── LOGIN PAGE ── */
#page-login{
  min-height:100vh;
  align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);
}
.login-card{
  background:var(--white);border-radius:18px;
  padding:2.5rem 2.2rem;width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.login-title{font-size:26px;font-weight:700;color:var(--navy);text-align:center;margin-bottom:1.8rem;}
.login-field{margin-bottom:14px;}
.login-field input{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);
  border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;
  background:var(--input-bg);color:var(--text);outline:none;
  transition:border-color 0.15s;
}
.login-field input:focus{border-color:var(--blue);}
.login-field input::placeholder{color:#94a3b8;}
.login-err{color:#dc2626;font-size:12px;min-height:18px;margin-top:4px;}
.login-btn{
  width:100%;padding:12px;background:var(--blue);border:none;
  border-radius:9px;color:#fff;font-size:15px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s;margin-top:6px;
}
.login-btn:hover{background:#1d4ed8;}

/* ── MAIN LAYOUT ── */
#page-main{min-height:100vh;flex-direction:row;}
.sidebar{
  width:148px;min-height:100vh;background:var(--navy);
  display:flex;flex-direction:column;padding:1.2rem 0.8rem;
  gap:8px;flex-shrink:0;position:fixed;top:0;left:0;height:100%;z-index:10;
}
.sidebar-title{
  color:#fff;font-size:14px;font-weight:700;
  padding:0.4rem 0.6rem;margin-bottom:0.4rem;letter-spacing:0.3px;
}
.sidebar-btn{
  background:rgba(255,255,255,0.12);border:none;border-radius:8px;
  color:#fff;font-size:12px;font-weight:500;padding:9px 10px;
  cursor:pointer;font-family:'Inter',sans-serif;text-align:left;
  transition:background 0.15s;
}
.sidebar-btn:hover{background:rgba(255,255,255,0.22);}
.sidebar-btn.danger{margin-top:auto;background:rgba(255,255,255,0.08);}
.sidebar-btn.danger:hover{background:rgba(220,38,38,0.3);}

.main-content{margin-left:148px;flex:1;padding:2rem 2.5rem;min-height:100vh;}

/* ── DASHBOARD ── */
#section-dashboard{}
.page-title{font-size:28px;font-weight:700;color:var(--text);margin-bottom:0.3rem;}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:1.8rem;}
.divider{height:1px;background:var(--border);margin-bottom:2rem;}

.cards-grid{
  display:flex;flex-wrap:wrap;gap:16px;
}
.person-card{
  background:var(--white);border:1.5px solid var(--border);
  border-radius:14px;padding:1.6rem 1.4rem;
  min-width:180px;cursor:pointer;
  font-size:15px;font-weight:700;color:var(--navy);
  letter-spacing:0.5px;text-align:center;
  box-shadow:var(--shadow);transition:all 0.18s;
  position:relative;overflow:hidden;
}
.person-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:3px;background:var(--blue);opacity:0;transition:opacity 0.18s;
}
.person-card:hover{
  box-shadow:var(--shadow-hover);transform:translateY(-3px);
  border-color:#bfdbfe;
}
.person-card:hover::after{opacity:1;}
.person-card .card-icon{font-size:28px;margin-bottom:10px;}
.person-card .card-dept{font-size:11px;color:var(--text2);font-weight:400;margin-top:4px;letter-spacing:0;}

/* ── DETAIL VIEW ── */
#section-detail{display:none;}
.back-note{font-size:13px;color:var(--text2);margin-bottom:1.8rem;}
.back-note button{
  background:none;border:none;color:var(--blue);font-size:13px;
  cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
  padding:0;text-decoration:underline;
}

.detail-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  max-width:860px;
}
.detail-header{
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 100%);
  padding:1.4rem 2rem;display:flex;align-items:center;gap:14px;
}
.detail-header-avatar{
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,0.18);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff;flex-shrink:0;
}
.detail-header-info{}
.detail-header-name{font-size:20px;font-weight:700;color:#fff;}
.detail-header-dept{font-size:12px;color:rgba(255,255,255,0.7);margin-top:2px;}

.detail-body{padding:1.8rem 2rem;}
.field-row{
  display:grid;grid-template-columns:220px 1fr;
  align-items:start;padding:1rem 0;
  border-bottom:1px solid var(--border);gap:1rem;
}
.field-row:last-child{border-bottom:none;}
.field-label{
  font-size:14px;font-weight:600;color:var(--label);
  padding-top:2px;
}
.field-value{
  font-size:14px;color:var(--text);background:var(--input-bg);
  border:1.5px solid var(--border);border-radius:8px;
  padding:9px 13px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
  min-height:40px;
}

.detail-actions{
  padding:1.2rem 2rem;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;
  background:#fafbfc;
}
.btn-save{
  padding:10px 28px;background:var(--blue);border:none;
  border-radius:9px;color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s;
}
.btn-save:hover{background:#1d4ed8;}
.btn-edit{
  padding:10px 22px;background:var(--white);border:1.5px solid var(--border);
  border-radius:9px;color:var(--text);font-size:14px;font-weight:500;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;
}
.btn-edit:hover{background:var(--bg);border-color:#94a3b8;}
.btn-delete{
  padding:10px 18px;background:var(--white);border:1.5px solid #fca5a5;
  border-radius:9px;color:#dc2626;font-size:14px;font-weight:500;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;
}
.btn-delete:hover{background:#fef2f2;}

/* edit mode */
.field-value.editable{
  background:#fff;border-color:#93c5fd;outline:none;
  box-shadow:0 0 0 3px rgba(59,130,246,0.1);
}

/* ── ADD MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:1rem;
}
.overlay.show{display:flex;}
.modal{
  background:var(--white);border-radius:16px;
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
  animation:up 0.2s ease;
}
@keyframes up{from{transform:translateY(18px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{
  padding:1.3rem 1.5rem;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-header h2{font-size:16px;font-weight:700;color:var(--navy);}
.modal-close{background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:1.4rem 1.5rem;}
.mfield{margin-bottom:14px;}
.mfield label{display:block;font-size:12px;font-weight:600;color:var(--label);margin-bottom:5px;}
.mfield input,.mfield textarea{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;
  background:var(--input-bg);color:var(--text);outline:none;
  transition:border-color 0.15s;
}
.mfield input:focus,.mfield textarea:focus{border-color:var(--blue);}
.mfield textarea{resize:vertical;min-height:90px;}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.8rem;right:1.8rem;
  background:var(--navy);color:#fff;border-radius:10px;
  padding:11px 18px;font-size:13px;font-weight:500;
  z-index:999;transform:translateY(20px);opacity:0;
  transition:all 0.25s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{background:#15803d;}
.toast.err{background:#dc2626;}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .sidebar{width:120px;}
  .main-content{margin-left:120px;padding:1.2rem;}
  .field-row{grid-template-columns:1fr;gap:4px;}
  .cards-grid{gap:10px;}
  .person-card{min-width:140px;padding:1.2rem 1rem;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="page-login" class="page active">
  <div class="login-card">
    <div class="login-title">Inventory</div>
    <div class="login-field"><input type="text" id="li-user" placeholder="Username" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="login-field"><input type="password" id="li-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="login-err" id="li-err"></div>
    <button class="login-btn" onclick="doLogin()">Login</button>
  </div>
</div>

<!-- MAIN -->
<div id="page-main" class="page">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Inventory Global</div>
    <button class="sidebar-btn" onclick="showDashboard()">📋 Dashboard</button>
    <button class="sidebar-btn" id="btn-create" onclick="showAddModal()" style="display:none">+ Create Inventory</button>
    <button class="sidebar-btn danger" style="margin-top:auto" onclick="doLogout()">Logout</button>
  </div>

  <!-- Content -->
  <div class="main-content">

    <!-- Dashboard -->
    <div id="section-dashboard">
      <div class="page-title">Dashboard</div>
      <div class="page-sub" id="dash-sub"></div>
      <div class="divider"></div>
      <div class="cards-grid" id="cards-grid"></div>
    </div>

    <!-- Detail -->
    <div id="section-detail" style="display:none">
      <div class="back-note"><button onclick="showDashboard()">← Back</button></div>
      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-header-avatar" id="d-avatar"></div>
          <div class="detail-header-info">
            <div class="detail-header-name" id="d-hname"></div>
            <div class="detail-header-dept" id="d-hdept"></div>
          </div>
        </div>
        <div class="detail-body" id="d-body"></div>
        <div class="detail-actions" id="d-actions"></div>
      </div>
    </div>

  </div>
</div>

<!-- Add Modal -->
<div class="overlay" id="add-overlay" onclick="closeAddClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>+ Create Inventory</h2>
      <button class="modal-close" onclick="closeOverlay('add-overlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="mfield"><label>Name *</label><input id="a-name" placeholder="Full name"/></div>
      <div class="mfield"><label>Department / Position</label><input id="a-dept" placeholder="cth: Design, Finance, IT"/></div>
      <div class="mfield"><label>Laptop</label><input id="a-laptop" placeholder="cth: LENOVO IdeaPad Slim 3"/></div>
      <div class="mfield"><label>Windows</label><input id="a-windows" placeholder="cth: Microsoft Windows 11"/></div>
      <div class="mfield"><label>CPU</label><input id="a-cpu" placeholder="cth: AMD Ryzen 5, Intel i7..."/></div>
      <div class="mfield"><label>GPU</label><input id="a-gpu" placeholder="cth: AMD Radeon, NVIDIA RTX..."/></div>
      <div class="mfield"><label>RAM</label><input id="a-ram" placeholder="cth: 16GB"/></div>
      <div class="mfield"><label>Storage</label><input id="a-storage" placeholder="cth: 512GB SSD"/></div>
      <div class="mfield"><label>Apps</label><textarea id="a-apps" placeholder="Satu app setiap baris&#10;- Adobe Photoshop&#10;- Microsoft Office..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-edit" onclick="closeOverlay('add-overlay')">Cancel</button>
      <button class="btn-save" onclick="addPerson()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
//  CONFIG — tukar credentials admin di sini
// ════════════════════════════════════════════
const ACCOUNTS = {
  'GameMaster': 'gm2024',   // username: password
  // tambah lebih ramai user di sini kalau perlu
};
const STORE_KEY = 'inv_global_v2';

// ════════════════════════════════════════════
//  DEFAULT DATA — isi betul-betul dari sistem asal
// ════════════════════════════════════════════
const DEFAULT_DATA = [
  {
    id: 'p1',
    name: 'SUGANTHY',
    dept: '',
    laptop: 'LENOVO_MT_82XQ_BU_idea_FM_IdeaPad Slim 3 15AMN8',
    windows: 'Microsoft Window 11',
    cpu: 'AMD Ryzen 5 7520U with Radeon Graphics, 2801 Mhz, 4 Core(s), 8 Logical',
    gpu: 'AMD Radeon',
    ram: '16GB',
    storage: '512GB',
    apps: `- ABSS ODBC Direct v18.8. MY\n- ABSS Premier v30.1 MY\n- Adobe Illustrator 2022\n- Adobe Acrobat\n- Adobe InDesign 2022\n- Adobe Photoshop 2022\n- Adobe Premiere Pro 2022\n- ChatGPT\n- LenovoNow\n- Lenovo Vantage\n- Lenovo Vantage Service\n- WhatsApp`
  },
  {
    id: 'p2',
    name: 'MS CLARE',
    dept: '',
    laptop: '',
    windows: '',
    cpu: '',
    gpu: '',
    ram: '',
    storage: '',
    apps: ''
  },
  {
    id: 'p3',
    name: 'SATCHEN',
    dept: '',
    laptop: '',
    windows: '',
    cpu: '',
    gpu: '',
    ram: '',
    storage: '',
    apps: ''
  },
  {
    id: 'p4',
    name: 'SHAA',
    dept: '',
    laptop: '',
    windows: '',
    cpu: '',
    gpu: '',
    ram: '',
    storage: '',
    apps: ''
  },
  {
    id: 'p5',
    name: 'TASNIM',
    dept: '',
    laptop: '',
    windows: '',
    cpu: '',
    gpu: '',
    ram: '',
    storage: '',
    apps: ''
  },
];

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let isLoggedIn = false;
let currentUser = '';
let people = [];
let currentId = null;
let editMode = false;

function loadData() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if(s) { people = JSON.parse(s); return; }
  } catch(e){}
  people = JSON.parse(JSON.stringify(DEFAULT_DATA));
  save();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(people)); } catch(e){}
}
function genId() {
  return 'p' + Date.now();
}

// ════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════
function doLogin() {
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const err = document.getElementById('li-err');
  if(ACCOUNTS[u] && ACCOUNTS[u] === p) {
    isLoggedIn = true;
    currentUser = u;
    err.textContent = '';
    document.getElementById('page-login').classList.remove('active');
    document.getElementById('page-main').classList.add('active');
    document.getElementById('btn-create').style.display = 'block';
    showDashboard();
  } else {
    err.textContent = 'Incorrect username or password.';
  }
}
function doLogout() {
  isLoggedIn = false;
  currentUser = '';
  document.getElementById('page-main').classList.remove('active');
  document.getElementById('page-login').classList.add('active');
  document.getElementById('li-user').value = '';
  document.getElementById('li-pass').value = '';
}

// ════════════════════════════════════════════
//  DASHBOARD
// ════════════════════════════════════════════
function showDashboard() {
  document.getElementById('section-dashboard').style.display = 'block';
  document.getElementById('section-detail').style.display = 'none';
  document.getElementById('dash-sub').textContent = people.length + ' inventory record(s)';
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = people.map(p => `
    <button class="person-card" onclick="openDetail('${p.id}')">
      <div class="card-icon">💻</div>
      <div>${p.name}</div>
      ${p.dept ? `<div class="card-dept">${p.dept}</div>` : ''}
    </button>`).join('');
}

// ════════════════════════════════════════════
//  DETAIL
// ════════════════════════════════════════════
const FIELDS = [
  { key:'name',    label:'Name' },
  { key:'laptop',  label:'Laptop' },
  { key:'windows', label:'Windows' },
  { key:'cpu',     label:'CPU' },
  { key:'gpu',     label:'GPU' },
  { key:'ram',     label:'RAM' },
  { key:'storage', label:'Storage' },
  { key:'apps',    label:'Apps', multiline:true },
];

function openDetail(id) {
  const p = people.find(x=>x.id===id);
  if(!p) return;
  currentId = id;
  editMode = false;
  document.getElementById('section-dashboard').style.display = 'none';
  document.getElementById('section-detail').style.display = 'block';
  renderDetail(p, false);
}

function renderDetail(p, editing) {
  document.getElementById('d-avatar').textContent = p.name.slice(0,2).toUpperCase();
  document.getElementById('d-hname').textContent = p.name;
  document.getElementById('d-hdept').textContent = p.dept || 'Inventory Record';

  document.getElementById('d-body').innerHTML = FIELDS.map(f => {
    const val = p[f.key] || '';
    if(editing) {
      if(f.multiline) {
        return `<div class="field-row">
          <div class="field-label">${f.label}</div>
          <textarea class="field-value editable" id="ef-${f.key}" rows="6" style="font-family:inherit;resize:vertical;">${val}</textarea>
        </div>`;
      }
      return `<div class="field-row">
        <div class="field-label">${f.label}</div>
        <input class="field-value editable" id="ef-${f.key}" value="${val.replace(/"/g,'&quot;')}"/>
      </div>`;
    }
    return `<div class="field-row">
      <div class="field-label">${f.label}</div>
      <div class="field-value">${val || '—'}</div>
    </div>`;
  }).join('');

  const act = document.getElementById('d-actions');
  if(editing) {
    act.innerHTML = `
      <button class="btn-edit" onclick="cancelEdit()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save</button>`;
  } else {
    act.innerHTML = `
      <button class="btn-delete" onclick="deletePerson('${p.id}')">Delete</button>
      <button class="btn-edit" onclick="startEdit()">✏️ Edit</button>`;
  }
}

function startEdit() {
  editMode = true;
  const p = people.find(x=>x.id===currentId);
  if(p) renderDetail(p, true);
}

function cancelEdit() {
  editMode = false;
  const p = people.find(x=>x.id===currentId);
  if(p) renderDetail(p, false);
}

function saveEdit() {
  const idx = people.findIndex(x=>x.id===currentId);
  if(idx<0) return;
  FIELDS.forEach(f => {
    const el = document.getElementById('ef-'+f.key);
    if(el) people[idx][f.key] = el.value.trim();
  });
  save();
  editMode = false;
  renderDetail(people[idx], false);
  // Update dashboard card name
  document.getElementById('d-hname').textContent = people[idx].name;
  showToast('Saved successfully!', 'ok');
}

function deletePerson(id) {
  if(!confirm('Delete this inventory record? This cannot be undone.')) return;
  people = people.filter(x=>x.id!==id);
  save();
  showDashboard();
  showToast('Record deleted.', 'ok');
}

// ════════════════════════════════════════════
//  ADD PERSON
// ════════════════════════════════════════════
function showAddModal() {
  ['name','dept','laptop','windows','cpu','gpu','ram','storage','apps'].forEach(k=>{
    document.getElementById('a-'+k).value='';
  });
  document.getElementById('add-overlay').classList.add('show');
}
function addPerson() {
  const name = document.getElementById('a-name').value.trim().toUpperCase();
  if(!name){ showToast('Name is required.','err'); return; }
  const p = {
    id: genId(), name,
    dept:    document.getElementById('a-dept').value.trim(),
    laptop:  document.getElementById('a-laptop').value.trim(),
    windows: document.getElementById('a-windows').value.trim(),
    cpu:     document.getElementById('a-cpu').value.trim(),
    gpu:     document.getElementById('a-gpu').value.trim(),
    ram:     document.getElementById('a-ram').value.trim(),
    storage: document.getElementById('a-storage').value.trim(),
    apps:    document.getElementById('a-apps').value.trim(),
  };
  people.push(p);
  save();
  closeOverlay('add-overlay');
  showDashboard();
  showToast(`${name} added!`, 'ok');
}
function closeAddClick(e){ if(e.target===document.getElementById('add-overlay')) closeOverlay('add-overlay'); }

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
function showToast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type?' '+type:'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
