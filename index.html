<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventori Aset Syarikat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0f12;
  --surface: #151820;
  --surface2: #1c2030;
  --border: #252a38;
  --border2: #2e3448;
  --accent: #4f8ef7;
  --accent2: #38d9a9;
  --warn: #f5a623;
  --danger: #f05252;
  --text: #e8eaf0;
  --text2: #8b92a8;
  --text3: #545c73;
  --mono: 'DM Mono', monospace;
  --sans: 'Sora', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;}

/* Subtle grid bg */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.3;pointer-events:none;z-index:0;}

.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:2rem 1.5rem;}

/* Header */
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2.5rem;gap:1rem;flex-wrap:wrap;}
.header-left{}
.logo-tag{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;}
.title{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-0.5px;}
.subtitle{font-size:13px;color:var(--text2);margin-top:4px;}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* Buttons */
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;border:none;transition:all 0.15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#3a7ae0;transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-success{background:var(--accent2);color:#0d0f12;}
.btn-success:hover{background:#2bc499;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-danger:hover{background:rgba(240,82,82,0.1);}
.btn-sm{padding:6px 12px;font-size:12px;}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;font-family:var(--mono);margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:700;font-family:var(--mono);}
.stat-aktif{color:var(--accent2);}
.stat-selenggara{color:var(--warn);}
.stat-lupus{color:var(--danger);}
.stat-total{color:var(--accent);}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;transition:border-color 0.15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
.filter-select{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--accent);}

/* Asset grid */
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:2rem;}
.asset-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem;cursor:pointer;text-align:left;width:100%;transition:all 0.18s;position:relative;overflow:hidden;}
.asset-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0;transition:opacity 0.18s;}
.asset-btn:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.asset-btn:hover::before{opacity:1;}
.asset-btn.status-selenggara::before{background:var(--warn);}
.asset-btn.status-dilupuskan::before{background:var(--danger);}
.asset-id{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:8px;}
.asset-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.3;}
.asset-cat{font-size:12px;color:var(--text2);margin-bottom:10px;}
.asset-footer{display:flex;align-items:center;justify-content:space-between;}
.status-badge{font-size:11px;font-weight:600;font-family:var(--mono);padding:3px 10px;border-radius:99px;}
.badge-aktif{background:rgba(56,217,169,0.12);color:var(--accent2);}
.badge-selenggara{background:rgba(245,166,35,0.12);color:var(--warn);}
.badge-dilupuskan{background:rgba(240,82,82,0.12);color:var(--danger);}
.asset-date{font-size:11px;color:var(--text3);font-family:var(--mono);}
.no-results{text-align:center;padding:3rem;color:var(--text3);font-size:14px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
.modal-title{font-size:17px;font-weight:700;}
.modal-id{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px;}
.close-btn{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;padding:2px;flex-shrink:0;}
.close-btn:hover{color:var(--text);}
.modal-body{padding:1.5rem;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.2rem;}
.detail-item{background:var(--bg);border-radius:8px;padding:12px;}
.detail-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;font-family:var(--mono);margin-bottom:4px;}
.detail-value{font-size:14px;color:var(--text);font-weight:500;}
.detail-full{grid-column:1/-1;}
.section-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;font-family:var(--mono);margin-bottom:10px;margin-top:1.2rem;}

/* History */
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{display:flex;gap:12px;align-items:flex-start;}
.history-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0;margin-top:5px;}
.history-dot.dot-edit{background:var(--accent);}
.history-dot.dot-status{background:var(--warn);}
.history-dot.dot-create{background:var(--accent2);}
.history-content{flex:1;}
.history-action{font-size:13px;color:var(--text);}
.history-meta{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:1px;}
.no-history{font-size:13px;color:var(--text3);}

/* Modal actions */
.modal-actions{padding:1rem 1.5rem 1.5rem;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);}

/* Edit form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1/-1;}
.form-label{font-size:12px;color:var(--text2);font-weight:600;}
.form-input,.form-select,.form-textarea{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;transition:border-color 0.15s;width:100%;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{resize:vertical;min-height:80px;}

/* Login modal */
.login-modal{max-width:360px;}
.login-body{padding:2rem;}
.login-title{font-size:20px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem;}
.login-err{color:var(--danger);font-size:12px;margin-top:8px;min-height:18px;}

/* Toast */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);z-index:999;transform:translateY(20px);opacity:0;transition:all 0.25s;pointer-events:none;max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.toast-success{border-color:var(--accent2);color:var(--accent2);}
.toast.toast-error{border-color:var(--danger);color:var(--danger);}

/* Export */
.export-note{font-size:12px;color:var(--text3);margin-top:8px;}

/* Admin bar */
.admin-bar{display:flex;align-items:center;gap:10px;background:rgba(79,142,247,0.08);border:1px solid rgba(79,142,247,0.2);border-radius:10px;padding:10px 14px;margin-bottom:1.5rem;}
.admin-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);flex-shrink:0;}
.admin-label{font-size:12px;color:var(--accent);flex:1;}
.admin-bar .btn-sm{margin-left:auto;}

@media(max-width:600px){
  .stats-bar{grid-template-columns:1fr 1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .title{font-size:22px;}
  .modal-actions{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-tag">Sistem Inventori</div>
      <div class="title">Aset Syarikat</div>
      <div class="subtitle">Pengurusan & rekod aset secara berpusat</div>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost" onclick="exportCSV()">⬇ Eksport CSV</button>
      <button class="btn btn-primary" id="btn-admin-login" onclick="showLoginModal()">🔐 Log Masuk Admin</button>
    </div>
  </div>

  <!-- Admin bar (hidden by default) -->
  <div class="admin-bar" id="admin-bar" style="display:none;">
    <div class="admin-dot"></div>
    <div class="admin-label">Mod Admin — anda boleh tambah, edit dan padam aset</div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Log Keluar</button>
    <button class="btn btn-primary btn-sm" onclick="showAddModal()">+ Tambah Aset</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Cari nama aset, ID, lokasi..." oninput="renderAssets()"/>
    </div>
    <select class="filter-select" id="filter-status" onchange="renderAssets()">
      <option value="">Semua Status</option>
      <option value="Aktif">Aktif</option>
      <option value="Diselenggara">Diselenggara</option>
      <option value="Dilupuskan">Dilupuskan</option>
    </select>
    <select class="filter-select" id="filter-kat" onchange="renderAssets()">
      <option value="">Semua Kategori</option>
    </select>
  </div>

  <!-- Assets -->
  <div class="assets-grid" id="assets-grid"></div>

</div>

<!-- Detail Modal -->
<div class="overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="modal" id="detail-modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="d-name"></div>
        <div class="modal-id" id="d-id"></div>
      </div>
      <button class="close-btn" onclick="closeOverlay('detail-overlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="detail-grid" id="d-grid"></div>
      <div class="section-title">Sejarah Perubahan</div>
      <div class="history-list" id="d-history"></div>
    </div>
    <div class="modal-actions" id="d-actions"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="form-overlay" onclick="closeFormClick(event)">
  <div class="modal" id="form-modal">
    <div class="modal-header">
      <div><div class="modal-title" id="form-title">Tambah Aset Baru</div></div>
      <button class="close-btn" onclick="closeOverlay('form-overlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nama Aset *</label><input class="form-input" id="f-name" placeholder="cth: Laptop Dell XPS 15"/></div>
        <div class="form-group"><label class="form-label">Kategori *</label><input class="form-input" id="f-kat" placeholder="cth: Komputer"/></div>
        <div class="form-group"><label class="form-label">Jenama / Model</label><input class="form-input" id="f-model" placeholder="cth: Dell XPS 15 9500"/></div>
        <div class="form-group"><label class="form-label">No. Siri</label><input class="form-input" id="f-siri" placeholder="cth: SN-20240001"/></div>
        <div class="form-group"><label class="form-label">Lokasi</label><input class="form-input" id="f-lokasi" placeholder="cth: Pejabat Utama"/></div>
        <div class="form-group"><label class="form-label">Pengguna / Pemegang</label><input class="form-input" id="f-pengguna" placeholder="cth: Ahmad bin Ali"/></div>
        <div class="form-group"><label class="form-label">Tarikh Perolehan</label><input class="form-input" id="f-tarikh" type="date"/></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="f-status">
            <option>Aktif</option><option>Diselenggara</option><option>Dilupuskan</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Nilai (RM)</label><input class="form-input" id="f-nilai" type="number" placeholder="0.00" min="0" step="0.01"/></div>
        <div class="form-group"><label class="form-label">Jabatan</label><input class="form-input" id="f-jabatan" placeholder="cth: IT / Operasi"/></div>
        <div class="form-group full"><label class="form-label">Catatan</label><textarea class="form-textarea" id="f-catatan" placeholder="Maklumat tambahan..."></textarea></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeOverlay('form-overlay')">Batal</button>
      <button class="btn btn-primary" onclick="saveAsset()">Simpan</button>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div class="overlay" id="login-overlay" onclick="closeLoginClick(event)">
  <div class="modal login-modal">
    <div class="modal-header">
      <div class="modal-title">Log Masuk Admin</div>
      <button class="close-btn" onclick="closeOverlay('login-overlay')">✕</button>
    </div>
    <div class="login-body">
      <div class="login-sub">Masukkan kata laluan untuk akses mod edit.</div>
      <div class="form-group">
        <label class="form-label">Kata Laluan</label>
        <input class="form-input" id="login-pass" type="password" placeholder="kata laluan admin" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div class="login-err" id="login-err"></div>
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeOverlay('login-overlay')">Batal</button>
        <button class="btn btn-primary" onclick="doLogin()">Masuk</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────
// TUKAR KATA LALUAN ADMIN DI SINI:
const ADMIN_PASSWORD = 'admin123';
const STORE_KEY = 'inventori_aset_v1';

// ─── DEFAULT DATA ────────────────────────────────────────
const DEFAULT_ASSETS = [
  {
    id:'AST-001', name:'Laptop Dell XPS 15', kategori:'Komputer',
    model:'Dell XPS 15 9500', siri:'SN-XPS-001', lokasi:'Pejabat IT',
    pengguna:'Ahmad bin Ali', jabatan:'Teknologi Maklumat',
    tarikh:'2022-03-15', nilai:5500, status:'Aktif',
    catatan:'Dilengkapi dengan RAM 16GB, SSD 512GB.',
    history:[{type:'create',action:'Aset didaftarkan',by:'Admin',date:'2022-03-15'}]
  },
  {
    id:'AST-002', name:'Projektor Epson EB-X51', kategori:'Elektronik',
    model:'Epson EB-X51', siri:'SN-EPX-002', lokasi:'Bilik Mesyuarat A',
    pengguna:'Jabatan Pengurusan', jabatan:'Pengurusan',
    tarikh:'2021-07-20', nilai:2800, status:'Aktif',
    catatan:'Digunakan untuk pembentangan rasmi.',
    history:[{type:'create',action:'Aset didaftarkan',by:'Admin',date:'2021-07-20'}]
  },
  {
    id:'AST-003', name:'Meja Kerja Kayu Jati', kategori:'Perabot',
    model:'Custom — Kayu Jati', siri:'-', lokasi:'Bilik Pengarah',
    pengguna:'Dato\' Razman', jabatan:'Pengurusan Atasan',
    tarikh:'2020-01-10', nilai:3200, status:'Aktif',
    catatan:'Meja kerja utama bilik pengarah.',
    history:[{type:'create',action:'Aset didaftarkan',by:'Admin',date:'2020-01-10'}]
  },
  {
    id:'AST-004', name:'Penghawa Dingin Daikin 2.0HP', kategori:'Elektrik',
    model:'Daikin FTKF50C', siri:'SN-DAK-004', lokasi:'Pejabat Akaun',
    pengguna:'Jabatan Akaun', jabatan:'Kewangan',
    tarikh:'2019-05-08', nilai:1900, status:'Diselenggara',
    catatan:'Sedang dalam proses servis oleh vendor.',
    history:[
      {type:'create',action:'Aset didaftarkan',by:'Admin',date:'2019-05-08'},
      {type:'status',action:'Status ditukar kepada Diselenggara',by:'Admin',date:'2024-11-01'}
    ]
  },
  {
    id:'AST-005', name:'Printer HP LaserJet Pro', kategori:'Komputer',
    model:'HP LaserJet Pro M404n', siri:'SN-HPL-005', lokasi:'Stor',
    pengguna:'-', jabatan:'IT',
    tarikh:'2018-09-12', nilai:1200, status:'Dilupuskan',
    catatan:'Rosak dan tidak dapat dibaiki. Perlu dilupuskan.',
    history:[
      {type:'create',action:'Aset didaftarkan',by:'Admin',date:'2018-09-12'},
      {type:'status',action:'Status ditukar kepada Dilupuskan',by:'Admin',date:'2024-01-15'}
    ]
  },
  {
    id:'AST-006', name:'Kenderaan Toyota Hilux', kategori:'Kenderaan',
    model:'Toyota Hilux 2.4G', siri:'No. Plat: ABC 1234', lokasi:'Kawasan Letak Kereta',
    pengguna:'Jabatan Operasi', jabatan:'Operasi',
    tarikh:'2021-11-30', nilai:92000, status:'Aktif',
    catatan:'Kenderaan operasi lapangan.',
    history:[{type:'create',action:'Aset didaftarkan',by:'Admin',date:'2021-11-30'}]
  },
];

// ─── STATE ───────────────────────────────────────────────
let isAdmin = false;
let editingId = null;
let assets = [];

function loadAssets() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if(s) { assets = JSON.parse(s); return; }
  } catch(e){}
  assets = JSON.parse(JSON.stringify(DEFAULT_ASSETS));
  saveAssets();
}
function saveAssets() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(assets)); } catch(e){}
}
function genId() {
  const nums = assets.map(a=>parseInt(a.id.replace('AST-',''))||0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'AST-' + String(next).padStart(3,'0');
}
function today() { return new Date().toISOString().slice(0,10); }

// ─── STATS ───────────────────────────────────────────────
function renderStats() {
  const total = assets.length;
  const aktif = assets.filter(a=>a.status==='Aktif').length;
  const sel = assets.filter(a=>a.status==='Diselenggara').length;
  const lup = assets.filter(a=>a.status==='Dilupuskan').length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Jumlah Aset</div><div class="stat-value stat-total">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Aktif</div><div class="stat-value stat-aktif">${aktif}</div></div>
    <div class="stat-card"><div class="stat-label">Diselenggara</div><div class="stat-value stat-selenggara">${sel}</div></div>
    <div class="stat-card"><div class="stat-label">Dilupuskan</div><div class="stat-value stat-lupus">${lup}</div></div>
  `;
}

// ─── FILTERS ─────────────────────────────────────────────
function buildKatFilter() {
  const kats = [...new Set(assets.map(a=>a.kategori))].sort();
  const sel = document.getElementById('filter-kat');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Semua Kategori</option>' +
    kats.map(k=>`<option value="${k}"${k===cur?' selected':''}>${k}</option>`).join('');
}

// ─── RENDER ASSETS ───────────────────────────────────────
function renderAssets() {
  buildKatFilter();
  const q = document.getElementById('search-input').value.toLowerCase();
  const fs = document.getElementById('filter-status').value;
  const fk = document.getElementById('filter-kat').value;

  const filtered = assets.filter(a=>{
    const match = !q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q)
      || a.lokasi.toLowerCase().includes(q) || a.kategori.toLowerCase().includes(q)
      || (a.pengguna||'').toLowerCase().includes(q);
    const mStatus = !fs || a.status===fs;
    const mKat = !fk || a.kategori===fk;
    return match && mStatus && mKat;
  });

  const grid = document.getElementById('assets-grid');
  if(!filtered.length) {
    grid.innerHTML = '<div class="no-results">Tiada aset ditemui.</div>';
    return;
  }
  grid.innerHTML = filtered.map(a => {
    const sc = a.status==='Aktif'?'aktif':a.status==='Diselenggara'?'selenggara':'dilupuskan';
    const bc = a.status==='Aktif'?'badge-aktif':a.status==='Diselenggara'?'badge-selenggara':'badge-dilupuskan';
    return `<button class="asset-btn status-${sc}" onclick="openDetail('${a.id}')">
      <div class="asset-id">${a.id}</div>
      <div class="asset-name">${a.name}</div>
      <div class="asset-cat">📁 ${a.kategori}${a.lokasi?' &nbsp;·&nbsp; 📍 '+a.lokasi:''}</div>
      <div class="asset-footer">
        <span class="status-badge ${bc}">${a.status}</span>
        <span class="asset-date">${a.tarikh||''}</span>
      </div>
    </button>`;
  }).join('');
  renderStats();
}

// ─── DETAIL ──────────────────────────────────────────────
function openDetail(id) {
  const a = assets.find(x=>x.id===id);
  if(!a) return;
  document.getElementById('d-name').textContent = a.name;
  document.getElementById('d-id').textContent = a.id;

  const sc = a.status==='Aktif'?'badge-aktif':a.status==='Diselenggara'?'badge-selenggara':'badge-dilupuskan';
  document.getElementById('d-grid').innerHTML = `
    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value"><span class="status-badge ${sc}">${a.status}</span></div></div>
    <div class="detail-item"><div class="detail-label">Kategori</div><div class="detail-value">${a.kategori}</div></div>
    <div class="detail-item"><div class="detail-label">Model / Jenama</div><div class="detail-value">${a.model||'—'}</div></div>
    <div class="detail-item"><div class="detail-label">No. Siri</div><div class="detail-value">${a.siri||'—'}</div></div>
    <div class="detail-item"><div class="detail-label">Lokasi</div><div class="detail-value">${a.lokasi||'—'}</div></div>
    <div class="detail-item"><div class="detail-label">Pengguna</div><div class="detail-value">${a.pengguna||'—'}</div></div>
    <div class="detail-item"><div class="detail-label">Jabatan</div><div class="detail-value">${a.jabatan||'—'}</div></div>
    <div class="detail-item"><div class="detail-label">Tarikh Perolehan</div><div class="detail-value">${a.tarikh||'—'}</div></div>
    <div class="detail-item"><div class="detail-label">Nilai (RM)</div><div class="detail-value">${a.nilai!=null?'RM '+Number(a.nilai).toLocaleString('ms-MY',{minimumFractionDigits:2}):'—'}</div></div>
    <div class="detail-item detail-full"><div class="detail-label">Catatan</div><div class="detail-value">${a.catatan||'—'}</div></div>
  `;

  const hist = a.history||[];
  document.getElementById('d-history').innerHTML = hist.length
    ? hist.slice().reverse().map(h=>`
        <div class="history-item">
          <div class="history-dot dot-${h.type}"></div>
          <div class="history-content">
            <div class="history-action">${h.action}</div>
            <div class="history-meta">${h.date} · ${h.by}</div>
          </div>
        </div>`).join('')
    : '<div class="no-history">Tiada sejarah.</div>';

  const actions = document.getElementById('d-actions');
  if(isAdmin) {
    actions.innerHTML = `
      <button class="btn btn-danger btn-sm" onclick="deleteAsset('${a.id}')">Padam</button>
      <button class="btn btn-ghost btn-sm" onclick="closeOverlay('detail-overlay')">Tutup</button>
      <button class="btn btn-primary btn-sm" onclick="showEditModal('${a.id}')">✏️ Edit</button>`;
  } else {
    actions.innerHTML = `<button class="btn btn-ghost" onclick="closeOverlay('detail-overlay')">Tutup</button>`;
  }

  document.getElementById('detail-overlay').classList.add('show');
}

function closeDetail(e) { if(e.target===document.getElementById('detail-overlay')) closeOverlay('detail-overlay'); }

// ─── ADD / EDIT FORM ─────────────────────────────────────
function showAddModal() {
  editingId = null;
  document.getElementById('form-title').textContent = 'Tambah Aset Baru';
  ['name','kat','model','siri','lokasi','pengguna','jabatan','catatan'].forEach(k=>document.getElementById('f-'+k).value='');
  document.getElementById('f-tarikh').value = today();
  document.getElementById('f-status').value = 'Aktif';
  document.getElementById('f-nilai').value = '';
  document.getElementById('form-overlay').classList.add('show');
}

function showEditModal(id) {
  const a = assets.find(x=>x.id===id);
  if(!a) return;
  editingId = id;
  document.getElementById('form-title').textContent = 'Edit Aset — ' + id;
  document.getElementById('f-name').value = a.name||'';
  document.getElementById('f-kat').value = a.kategori||'';
  document.getElementById('f-model').value = a.model||'';
  document.getElementById('f-siri').value = a.siri||'';
  document.getElementById('f-lokasi').value = a.lokasi||'';
  document.getElementById('f-pengguna').value = a.pengguna||'';
  document.getElementById('f-jabatan').value = a.jabatan||'';
  document.getElementById('f-tarikh').value = a.tarikh||'';
  document.getElementById('f-status').value = a.status||'Aktif';
  document.getElementById('f-nilai').value = a.nilai!=null?a.nilai:'';
  document.getElementById('f-catatan').value = a.catatan||'';
  closeOverlay('detail-overlay');
  document.getElementById('form-overlay').classList.add('show');
}

function saveAsset() {
  const name = document.getElementById('f-name').value.trim();
  const kat = document.getElementById('f-kat').value.trim();
  if(!name||!kat){ showToast('Nama dan kategori wajib diisi.','error'); return; }

  const nowDate = today();
  const status = document.getElementById('f-status').value;

  if(editingId) {
    const idx = assets.findIndex(a=>a.id===editingId);
    if(idx<0) return;
    const old = assets[idx];
    const hist = [...(old.history||[])];
    if(old.status!==status) hist.push({type:'status',action:`Status ditukar kepada ${status}`,by:'Admin',date:nowDate});
    hist.push({type:'edit',action:'Maklumat aset dikemaskini',by:'Admin',date:nowDate});
    assets[idx] = {
      ...old,
      name, kategori:kat,
      model:document.getElementById('f-model').value.trim()||old.model,
      siri:document.getElementById('f-siri').value.trim()||old.siri,
      lokasi:document.getElementById('f-lokasi').value.trim(),
      pengguna:document.getElementById('f-pengguna').value.trim(),
      jabatan:document.getElementById('f-jabatan').value.trim(),
      tarikh:document.getElementById('f-tarikh').value||old.tarikh,
      status,
      nilai:document.getElementById('f-nilai').value!==''?parseFloat(document.getElementById('f-nilai').value):old.nilai,
      catatan:document.getElementById('f-catatan').value.trim(),
      history:hist
    };
    showToast('Aset berjaya dikemaskini!','success');
  } else {
    const newId = genId();
    assets.push({
      id:newId, name, kategori:kat,
      model:document.getElementById('f-model').value.trim(),
      siri:document.getElementById('f-siri').value.trim(),
      lokasi:document.getElementById('f-lokasi').value.trim(),
      pengguna:document.getElementById('f-pengguna').value.trim(),
      jabatan:document.getElementById('f-jabatan').value.trim(),
      tarikh:document.getElementById('f-tarikh').value,
      status,
      nilai:document.getElementById('f-nilai').value!==''?parseFloat(document.getElementById('f-nilai').value):null,
      catatan:document.getElementById('f-catatan').value.trim(),
      history:[{type:'create',action:'Aset didaftarkan',by:'Admin',date:nowDate}]
    });
    showToast(`Aset ${newId} berjaya ditambah!`,'success');
  }
  saveAssets();
  closeOverlay('form-overlay');
  renderAssets();
}

function deleteAsset(id) {
  if(!confirm(`Padam aset ${id}? Tindakan ini tidak boleh dibatalkan.`)) return;
  assets = assets.filter(a=>a.id!==id);
  saveAssets();
  closeOverlay('detail-overlay');
  renderAssets();
  showToast('Aset berjaya dipadamkan.','success');
}

function closeFormClick(e) { if(e.target===document.getElementById('form-overlay')) closeOverlay('form-overlay'); }

// ─── EXPORT CSV ──────────────────────────────────────────
function exportCSV() {
  const headers = ['ID','Nama','Kategori','Model','No. Siri','Lokasi','Pengguna','Jabatan','Tarikh Perolehan','Status','Nilai (RM)','Catatan'];
  const rows = assets.map(a=>[
    a.id, a.name, a.kategori, a.model||'', a.siri||'',
    a.lokasi||'', a.pengguna||'', a.jabatan||'', a.tarikh||'',
    a.status, a.nilai!=null?a.nilai:'', (a.catatan||'').replace(/,/g,';')
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`inventori_aset_${today()}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV berjaya dieksport!','success');
}

// ─── AUTH ────────────────────────────────────────────────
function showLoginModal() { document.getElementById('login-pass').value=''; document.getElementById('login-err').textContent=''; document.getElementById('login-overlay').classList.add('show'); setTimeout(()=>document.getElementById('login-pass').focus(),100); }
function doLogin() {
  const p = document.getElementById('login-pass').value;
  if(p===ADMIN_PASSWORD) {
    isAdmin=true;
    closeOverlay('login-overlay');
    document.getElementById('admin-bar').style.display='flex';
    document.getElementById('btn-admin-login').style.display='none';
    showToast('Selamat datang, Admin!','success');
    renderAssets();
  } else {
    document.getElementById('login-err').textContent='Kata laluan salah.';
  }
}
function doLogout() {
  isAdmin=false;
  document.getElementById('admin-bar').style.display='none';
  document.getElementById('btn-admin-login').style.display='';
  showToast('Anda telah log keluar.');
  renderAssets();
}
function closeLoginClick(e) { if(e.target===document.getElementById('login-overlay')) closeOverlay('login-overlay'); }

// ─── UTILS ───────────────────────────────────────────────
function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?' toast-'+type:'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ─── INIT ────────────────────────────────────────────────
loadAssets();
renderAssets();
</script>
